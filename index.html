<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#75c65a" />
    <title>Slopfarm</title>
  </head>
  <body>
    <main id="app">
      <section id="hud" aria-live="polite">
        <div class="brand">SLOPFARM</div>
        <div class="counter"><span>🪙</span><strong id="coins">0</strong></div>
        <div class="counter"><span>🪵</span><strong id="wood">0</strong></div>
      </section>
      <section id="instructions">
        <strong>Approche les arbres</strong>
        <span>ZQSD / WASD · U améliore la hache pendant le prototype</span>
      </section>
      <canvas id="game" aria-label="Zone de jeu 3D"></canvas>
      <p id="error" hidden></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
